name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x86_64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json | Select-Object -ExpandProperty packages | Select-Object -First 1 -ExpandProperty version
          if ($tagVersion -ne $packageVersion) { throw "Tag version $tagVersion does not match Cargo package version $packageVersion" }
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $name = "emutrim-v$version-windows-x86_64"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/emutrim.exe, README.md, LICENSE -Destination dist
          Compress-Archive -Path dist/emutrim.exe, dist/README.md, dist/LICENSE -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: emutrim-v*-windows-x86_64.zip*
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | ruby -rjson -e 'puts JSON.parse(STDIN.read)["packages"][0]["version"]')"
          test "$tag_version" = "$package_version" || { echo "Tag version $tag_version does not match Cargo package version $package_version"; exit 1; }
      - run: cargo build --release
      - name: Package
        run: |
          name="emutrim-${GITHUB_REF_NAME}-macos-arm64"
          mkdir dist
          cp target/release/emutrim README.md LICENSE dist/
          tar -czf "$name.tar.gz" -C dist emutrim README.md LICENSE
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: emutrim-v*-macos-arm64.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "EmuTrim ${GITHUB_REF_NAME#v}" \
            --notes "Apple Silicon macOS support; isolated managed Android environments and safe managed cleanup; verified macOS launch identity; existing Windows support. macOS stats is not yet supported. Linux remains CI/core-only."
