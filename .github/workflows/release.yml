name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x86_64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json | Select-Object -ExpandProperty packages | Select-Object -First 1 -ExpandProperty version
          if ($tagVersion -ne $packageVersion) { throw "Tag version $tagVersion does not match Cargo package version $packageVersion" }
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $name = "emutrim-v$version-windows-x86_64"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/emutrim.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination dist
          Compress-Archive -Path dist/emutrim.exe, dist/README.md, dist/LICENSE, dist/THIRD_PARTY_NOTICES.md -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: emutrim-v*-windows-x86_64.zip*
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | ruby -rjson -e 'puts JSON.parse(STDIN.read)["packages"][0]["version"]')"
          test "$tag_version" = "$package_version" || { echo "Tag version $tag_version does not match Cargo package version $package_version"; exit 1; }
      - run: cargo build --release
      - name: Package
        run: |
          name="emutrim-${GITHUB_REF_NAME}-macos-arm64"
          mkdir dist
          cp target/release/emutrim README.md LICENSE THIRD_PARTY_NOTICES.md dist/
          tar -czf "$name.tar.gz" -C dist emutrim README.md LICENSE THIRD_PARTY_NOTICES.md
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: emutrim-v*-macos-arm64.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish or verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          expected=(
            "emutrim-v${version}-windows-x86_64.zip"
            "emutrim-v${version}-windows-x86_64.zip.sha256"
            "emutrim-v${version}-macos-arm64.tar.gz"
            "emutrim-v${version}-macos-arm64.tar.gz.sha256"
          )

          verify_release() {
            local release_json="$1" asset
            jq -e --arg tag "$tag" --argjson count "${#expected[@]}" '
              .tagName == $tag and .isDraft == false and .isPrerelease == false and (.assets | length) == $count
            ' <<<"$release_json" >/dev/null || {
              echo "Release $tag is not public, complete, or correctly tagged" >&2
              return 1
            }
            for asset in "${expected[@]}"; do
              jq -e --arg name "$asset" '.assets | any(.name == $name)' <<<"$release_json" >/dev/null || {
                echo "Existing release $tag is missing expected asset: $asset" >&2
                return 1
              }
            done
          }

          if release_json="$(gh release view "$tag" --json tagName,isDraft,isPrerelease,assets 2>/dev/null)"; then
            verify_release "$release_json"
            echo "Release $tag already exists with expected assets; verified."
            exit 0
          fi

          # A missing release has no verifiable assets; create it once. If another
          # publisher wins the race, accept only its complete matching release.
          notes_file=".github/release-notes/${tag}.md"
          if [[ ! -f "$notes_file" ]]; then
            cat > release-notes.md <<'EOF'
          Release notes for this version are maintained separately.

          Licensing: v0.5.0 and later is source-available under MIT with Commons Clause License Condition v1.0. v0.4.0 and earlier remain MIT.

          Platforms: Windows x86_64 and Apple Silicon macOS (arm64). macOS stats is not supported. Linux remains CI/core-only.
          EOF
            notes_file=release-notes.md
          fi
          if gh release create "$tag" dist/* \
            --title "EmuTrim $version" \
            --notes-file "$notes_file"; then
            exit 0
          fi

          echo "Release creation failed; checking whether a concurrent publisher completed it." >&2
          release_json="$(gh release view "$tag" --json tagName,isDraft,isPrerelease,assets)"
          verify_release "$release_json"
